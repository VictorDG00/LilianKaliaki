<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lilian Kaliaki{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/">Lilian Kaliaki</a>
      <nav class="nav">
        <a href="/#servicos">Serviços</a>
        <a href="/#produtos">Produtos</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>&copy; Lilian Kaliaki</p>
  </footer>

  <div id="drawer-root">
    <div class="drawer-overlay" onclick="fecharDrawer()"></div>
    <aside class="drawer">
      <button type="button" class="drawer-close" onclick="fecharDrawer()">&times;</button>
      <div id="drawer-content"></div>
    </aside>
  </div>
  <script>
    function abrirDrawer() {
      document.getElementById('drawer-root').classList.add('open');
    }
    function fecharDrawer() {
      document.getElementById('drawer-root').classList.remove('open');
    }
  </script>
</body>
</html>
