<div class="checkout-box">
  <h3>{{ titulo }}</h3>
  <p>{{ mensagem }}</p>
  <div id="checkout-brick"></div>
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script>
    const mp = new MercadoPago("{{ public_key }}");
    mp.bricks().create("payment", "checkout-brick", {
      initialization: {
        preferenceId: "{{ preference_id }}",
      },
      callbacks: {
        onError: (error) => console.error(error),
      },
    });
  </script>
  <button type="button" class="btn btn-outline" onclick="fecharDrawer()">Fechar</button>
</div>
{% if servico_id %}
<p class="selecao" id="servico-selecao-{{ servico_id }}" hx-swap-oob="true">✓ Reservado</p>
{% endif %}
