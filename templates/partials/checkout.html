<div class="checkout-box">
  <h3>{{ titulo }}</h3>
  <p>{{ mensagem }}</p>
  <div id="checkout-brick"></div>
  <script>
    (function () {
      const mp = new MercadoPago("{{ public_key }}");
      mp.bricks().create("payment", "checkout-brick", {
        initialization: {
          amount: {{ amount }},
        },
        customization: {
          paymentMethods: {
            creditCard: "all",
            debitCard: "all",
          },
        },
        callbacks: {
          onReady: () => {},
          onError: (error) => console.error(error),
          onSubmit: ({ formData }) => {
            return new Promise((resolve, reject) => {
              fetch("/pagar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ...formData, external_reference: "{{ external_reference }}" }),
              })
                .then((res) => res.json())
                .then((data) => {
                  if (["approved", "pending", "in_process"].includes(data.status)) {
                    resolve();
                  } else {
                    reject();
                  }
                })
                .catch(() => reject());
            });
          },
        },
      });
    })();
  </script>
  <button type="button" class="btn btn-outline" onclick="fecharDrawer()">Fechar</button>
</div>
{% if servico_id %}
<p class="selecao" id="servico-selecao-{{ servico_id }}" hx-swap-oob="true">✓ Reservado</p>
{% endif %}
