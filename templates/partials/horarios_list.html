<button
  type="button"
  class="drawer-voltar"
  hx-get="/agendar/passo-data"
  hx-vals='{"servico_id": {{ servico.id }}}'
  hx-target="#drawer-content"
  hx-swap="innerHTML"
>
  ← Escolher outro dia
</button>

<div class="drawer-step-header">
  <h3>{{ servico.titulo }}</h3>
  <p class="preco">{{ data_str }}</p>
</div>

{% if slots %}
<div class="horarios-grid">
  {% for slot in slots %}
  <button
    type="button"
    hx-get="/agendar/passo-form"
    hx-vals='{"servico_id": {{ servico.id }}, "data_hora": "{{ slot.isoformat() }}"}'
    hx-target="#drawer-content"
    hx-swap="innerHTML"
  >
    {{ slot.strftime("%H:%M") }}
  </button>
  {% endfor %}
</div>
{% else %}
<p class="vazio">Nenhum horário disponível nessa data.</p>
{% endif %}

<p class="selecao" id="servico-selecao-{{ servico.id }}" hx-swap-oob="true">📅 {{ data_str }}</p>
